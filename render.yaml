# Render.com deployment config for Bollywood Connect the Stars API
# Deploy via: Dashboard → Blueprint → Connect repo → This file auto-detected
# Or manually create a Web Service with these settings

services:
  - type: web
    name: bollywood-connect-api
    runtime: node
    plan: free
    rootDir: .
    buildCommand: npm install && npm run db:generate -w @bollywood-connect/db && npm run build --workspaces
    startCommand: npm run start -w @bollywood-connect/api
    envVars:
      - key: DATABASE_URL
        sync: false  # Set manually in Render dashboard
      - key: PORT
        value: 10000
      - key: NODE_ENV
        value: production
      - key: NPM_CONFIG_LEGACY_PEER_DEPS
        value: "true"
